name: Pages

# 배포는 Vercel 이 맡는다(https://ashfall-chronicles.vercel.app).
# 이 워크플로는 GitHub Pages 로도 올리고 싶을 때를 위한 예비 경로라 수동 실행만 둔다.
# push 마다 돌게 해 두면 Pages 를 켜지 않은 상태에서 매번 실패로 표시된다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Vercel 의 buildCommand 와 같은 스크립트를 쓴다 — 산출물이 갈라지지 않게.
      - name: 사이트 빌드
        run: bash tools/build-site.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
