name: Release

# v1.0.6 같은 태그를 push하면 zip(브라우저로 여는 판 둘 + 앱으로 여는 판 넷)을 만들어 Release에 첨부한다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 1.0.5)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 결정
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # 번들 대조(build.sh)에 esbuild 가 필요하다 — 없으면 대조를 건너뛰고 커밋된 번들로 묶는다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: zip 빌드
        run: bash tools/build.sh "${{ steps.ver.outputs.value }}"

      # 앱으로 여는 판(Electron · 서명 없음) — Windows 아이콘(rcedit)은 wine 이 있어야 박힌다. 못 깔면 기본 아이콘으로.
      - name: wine (Windows 앱 아이콘)
        run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update -qq && sudo apt-get install -y -qq wine wine64 wine32 || echo "wine 없음 — Windows 앱은 기본 아이콘"
      - name: 앱 zip 빌드
        run: |
          (cd desktop && npm ci)
          bash tools/build-desktop.sh "${{ steps.ver.outputs.value }}"

      # 릴리스 본문 = docs/v<버전>-changelog.md(있으면) + 자동 커밋 목록
      - name: 릴리스 노트
        run: |
          f="docs/v${{ steps.ver.outputs.value }}-changelog.md"
          if [ -f "$f" ]; then cp "$f" dist/NOTES.md; else : > dist/NOTES.md; fi

      - name: Release에 첨부
        uses: softprops/action-gh-release@v2
        with:
          # 수동 실행(workflow_dispatch)에는 태그가 없다 — 이름을 주면 지금 커밋에 태그를 만들어 붙인다.
          # (Google 로그인 계정은 터미널에서 태그를 push 할 비밀번호가 없어, 웹의 Run workflow 로 낸다)
          tag_name: v${{ steps.ver.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.value }}
          files: |
            dist/AshfallChronicles-*.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS-App.txt
          body_path: dist/NOTES.md
          generate_release_notes: true
