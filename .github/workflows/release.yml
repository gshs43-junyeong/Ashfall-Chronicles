name: Release

# v1.0.6 같은 태그를 push하면 zip 두 개를 만들어 Release에 첨부한다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 1.0.5)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 결정
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: zip 빌드
        run: bash tools/build.sh "${{ steps.ver.outputs.value }}"

      - name: Release에 첨부
        uses: softprops/action-gh-release@v2
        with:
          # 수동 실행(workflow_dispatch)에는 태그가 없다 — 이름을 주면 지금 커밋에 태그를 만들어 붙인다.
          # (Google 로그인 계정은 터미널에서 태그를 push 할 비밀번호가 없어, 웹의 Run workflow 로 낸다)
          tag_name: v${{ steps.ver.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.value }}
          files: |
            dist/AshfallChronicles-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
