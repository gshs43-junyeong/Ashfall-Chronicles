# 배포 사이트 — vercel.json 과 같은 모양으로 서빙한다(되돌려 보내기 · 끝 빗금 없음 · 캐시 규칙).
# ★ vercel.json 을 고쳤으면 여기도 같이. 둘이 어긋나면 "Docker 에선 되는데 배포에선 안 된다"가 된다.
server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;               # 포트를 바꿔 띄워도 Location 이 맞게

  location = /              { return 302 /home; }
  location = /index.html    { return 301 /home; }
  location = /download.html { return 301 /download; }
  location = /play          { return 302 /play/index.html; }

  # 늘 새로 확인할 것 — 페이지 · 사이트 스크립트 · 게임 html · 판 표식
  location ~ ^/(home|download)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri/index.html =404;
  }
  location ~ ^/(hero|showcase|content)\.js$|^/style\.css$|^/play/.*\.html$|^/play/assets/manifest\.json$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }
  location = /play/version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  # 게임 코드·그림은 ?v= 가 붙어 나가므로 오래 둔다
  location ~ ^/play/.*\.(js|css|png|jpg|jpeg|webp|gif|svg|mp3|ogg|wav|m4a|woff|woff2|ttf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / { try_files $uri $uri/index.html =404; }
}
