# 멀티플레이 방 중개 — 배포: .github/workflows/relay.yml (CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID)
name = "ashfall-relay"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 무료 요금제는 SQLite 저장소를 쓰는 Durable Object 만 된다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
